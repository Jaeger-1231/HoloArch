window_padding_width 8
hide_window_decorations yes
background_opacity 0.8
font_family JetBrains Maple Mono 
font_size 13.5
remember_window_size no
confirm_os_window_close 0
shell fish
cursor_trail 1 
cursor_shape beam
shell_integration no-cursor

# BEGIN_KITTY_THEME
# Matugen
include current-theme.conf
# END_KITTY_THEME

# ── 图片粘贴 ─────────────────────────────────────────────────────────
# Ctrl+Shift+V：剪贴板是图片 → 存 /tmp、浮层预览、把路径贴给前台 CLI
#               否则        → 普通文本粘贴
# 带上 --allow-fallback=shifted,ascii（与 kitty 所有默认快捷键一致），
# 这样老式程序里 Ctrl+V 仍然走这条；而 Claude Code 这类启用了 kitty 键盘
# 协议的程序，Ctrl+V 依旧保持它自己的原生行为。
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}
map --allow-fallback=shifted,ascii ctrl+shift+v launch --type=background --allow-remote-control /home/zhuoran/.local/bin/clip-image-paste
