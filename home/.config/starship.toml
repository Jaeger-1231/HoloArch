"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
format = """
[╭─](fg:245)${custom.location}\
$fill\
${custom.toolchain}\
($conda$pixi)\
($git_branch$git_status)\
$directory\
$time\
$line_break\
[╰─](fg:245)$character"""

[fill]
symbol = ' '

[custom.location]
when = true
shell = ['sh']
command = 'if [ "$PWD" = "$HOME" ]; then printf "󰋜"; else printf ""; fi'
format = '[](fg:254)[ $output ](fg:233 bg:254)[](fg:254)'

# Show the installed toolchain in the reference-style icon capsule.
[custom.toolchain]
when = true
shell = ['sh']
command = '''
command -v python3 >/dev/null 2>&1 && printf ' '
command -v git >/dev/null 2>&1 && printf ' '
command -v node >/dev/null 2>&1 && printf ' '
command -v cc >/dev/null 2>&1 && printf ' '
command -v c++ >/dev/null 2>&1 && printf ' '
true
'''
format = '[](fg:252)[ $output](fg:235 bg:252)[](fg:252) '

[directory]
format = '[ $path ](fg:7)'
home_symbol = '~'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true
read_only = ' '

[time]
disabled = false
time_format = '%T'
format = '[](fg:254)[  $time ](fg:233 bg:254)[](fg:254)'

[git_branch]
symbol = ' '
format = '[$symbol$branch](fg:7) '

[git_status]
format = '[$all_status$ahead_behind](fg:248) '

[conda]
ignore_base = true
symbol = ' '
format = '[$symbol$environment](fg:7) '

[pixi]
format = '[$symbol$environment](fg:7) '

[line_break]
disabled = false

[character]
success_symbol = '[▶](fg:7)'
error_symbol = '[▶](fg:248)'
vimcmd_symbol = '[◀](fg:254)'
